  - "G21 v0.1 RELEASED 2026-09-19 (aging 014, crossed with our own 014). DATAREPO-19 is answered: they took the second fork, so the release is on datarepo 0.3.1 / schema 0.0.3. Bundle 31fac552c5d748f0, catalog 08fb3a5e3078dce5, 50 checks passed, id_rate 0.0998, title filled from the manifest, all five reconciliation checks green. The 84ca279df425c0a2 build is SUPERSEDED, NOT WITHDRAWN - both bundles stay in the store and aging's RELEASES.md records the supersession and what changed. They fixed the id_rate without re-searching, via a new pipeline/bin/reprovenance.py that recomputes only the interpretation half of a provenance record (id_rate, mbr, contamination and their flags) through the same function the search stage calls, and appends a `rederived` entry naming what changed from what to what. Their framing is worth borrowing: a provenance record holds history (commands, versions, hashes, timings - true forever) and interpretations (metrics under versioned definitions - these move), and only the second kind goes stale."
  - "G22 CLOSED 2026-09-20 in datarepo 0.4.0, both halves. THE METRICS: contamination_psm_share at dataset scope (aging:DEF-CONTAM-PSM v1) with contaminant_psms and target_plus_contaminant_psms so the share can be re-derived, and contamination_intensity_share PER RUN, one row per file (QuantProject:DEF-QC-9 v2), keyed on the deposited run_id so it joins runs; a file that will not resolve gets no row rather than a dangling one. aging's median/min/max ride at dataset scope under names and a source string that say they are summaries of the per-run values, not a measurement of the dataset. On PXD036557: 18 per-run rows, 0.0264-0.1892, against the 7.0% dataset figure. THE GENERAL QUESTION (aging 014 section 4, per-run grain as a default) is answered in thread 018 section 3 as a rule worth locking: A NUMBER IS STORED AT THE GRAIN AT WHICH IT WAS MEASURED, NEVER COARSER AND NEVER FINER. Never coarser is the contamination case. Never finer is aging's own: their 008 says the per-file FDR numbers are a different FDR calculation and must never be summed, so psms_1pct stays dataset-scope though a per-run figure exists and would be easy to write. And two grains of one quantity are two definitions, not one metric queried differently, so we emit no dataset-level intensity share - it would need a stated weighting, and the unweighted mean of ratios is not the ratio of sums. Needs no schema change; Metric.scope already carries both. Enforceable only where the producer states a grain, so thread 018 asks aging and QuantProject to say the grain in a definition's text."

  - "G23 AGING-Q2 CLOSED 2026-09-20 in datarepo 0.4.0, and it was bigger than the request. Rows that share an identifier AND are identical in every column collapse to one, recorded in bundle.json under collapsed_duplicates and as a collapsed_duplicate_rows finding (severity info, because nothing about the bundle is wrong); rows that share an identifier and differ anywhere still refuse the bundle, with a message saying why the two cases differ. PXD027318 now ingests: 7,463 protein_groups from the file's 7,465, and protein_groups_1pct 4,478 matches aging exactly. THE PART AGING DID NOT KNOW: the duplicate also tripled a QUANTITY. quant_values had no identifier at all, so three identical group rows wrote three identical spectral-count rows in one file, and a caller summing intensities would have read the group as three times as abundant - individually correct values, no count reconciling them, nothing that would ever have flagged it. quant_values now has a natural key (assay_id, feature_type, feature_id, definition_id), verified 0 duplicates in PXD036557's 50,085 and PXD032202's 141,327 rows before it was made a rule. psms and findings are deliberately NOT collapsible: a row there is an event and the row count is itself a reported number, so collapsing would be lossless in content and lossy in count; a duplicate psm_id is our own id-construction bug and must stop the write. Also added reconcile.metric_conflicts - psms_1pct reaches a bundle from provenance AND from results.txt under one definition, which nothing was comparing until now. Told aging in thread 018 sections 1-2."

  - "G24 Re-ingest is owed to aging and is theirs to schedule. datarepo 0.4.0 changes __version__, which is in the bundle hash, so every dataset gets a new bundle id: PXD036557 re-ingests to aca8113f17e96c06 with all five reconciliation checks green and metrics 140 -> 164. v0.1 stays valid exactly as released - 31fac552c5d748f0 is on disk and citable and re-ingesting does not touch it. Whether v0.1 is re-cut on 0.4.0 is aging's call; the only changes to an existing bundle are the five definition IDs and the contamination metrics, both additive, and the case for re-cutting is that PXD027318 can now be in it. UPDATED 2026-09-20: 0.5.0 makes this bigger. It changes __version__ AND the schema (0.0.3 to 0.0.4), and this time the ROWS change - ptm_sites gains 42 rows across the three datasets and every ptm_site_id string is different. aging 019 section 6 has already ruled that v0.1 stays as released and is not re-cut, and that a new release waits on the PXD060431 ruling. Nothing here changes that; we told them in 021 section 7 that the study layer is next and does not touch ptm_sites, so there is no hurry from our side."

  - "G25 ptm_site_id rekey. CLOSED 2026-09-20 in datarepo 0.5.0 / schema 0.0.4, taking aging's option (1) from their 019 section 3 and 020. The key is now <dataset_id>:<accession>:<residue><position>:<modification_name>, where the last component is the engine's own IdWithMotif; PtmSite.modification is nullable and PtmSite.modification_name is required. WHY IT WAS BIGGER THAN THE REQUEST: a key ending in the UNIMOD accession cannot be formed for a modification that has none, so those sites were not written as nulls - they were not written. Across the three datasets that was 42 sites over 10 chemistries, 195 PSMs, and only ONE of the ten was ever named in a finding: the other nine resolve to a MASS but not an accession, so they never entered proforma.unresolved and left no trace anywhere. PXD036557's 0.4.0 bundle records unresolved {} and was missing PXD036557:P16401:K37:N6-succinyllysine on K, which means the RELEASED v0.1 catalog is missing a row and contains nothing that says so. The recovered chemistries are succinyl-, glutaryl-, malonyl-, crotonyl- and methacryl-lysine, nitrotyrosine, two hydroxylations and O-palmitoleoyl serine - a lysine-acylation-shaped hole in an aging repository. aging's 020 added the decisive case: GG (Ubiquitination Site) on K has no cross-reference in mzLib 1.0.591, so on a diGly dataset the deletion is the subject of the experiment. THE COST, which is real: the name key is FINER than the accession key, because one chemistry can arrive under two names (Phosphorylation on S from the variable-mod list, Phosphoserine on S from a UniProt annotation), and 5 sites in 35,615 split. It is recoverable exactly and the deletion was not - the new catalog view ptm_sites_by_chemistry groups them back and reproduces the accession-keyed table on all 35,568 groups of the three datasets, n_psms summing and best_q_value taking the minimum, zero mismatches. That asymmetry is the whole argument, and it is U8's grain rule deciding a case where the coarser table was the one we already had."
  - "G26 The modification registry parses mzLib's resources instead of asking its loader. OPEN, logged as U9, raised to aging and QuantProject in thread 021 section 5, and found only because aging's 020 postscript told us to look. ModRegistry.from_metamorpheus reads Mods/*.txt and Data/ptmlist.txt and parses the DR Unimod lines itself. It never reads Data/unimod.xml - mzLib's largest and only fully-mapped source - and its precedence is alphabetical by filename, so Mods.txt beats ptmlist.txt, the REVERSE of the loader's Unimod then UniProt then MetaMorpheus. Measured against QuantProject/design/reference/IdWithMotif-to-Unimod.1.0.591.tsv (3,139 names, generated by running the loader): no entry at all for 2,445, agrees on 635, returns null for 57 the loader resolves, and differs on exactly TWO - Decarboxylation on D and on E, where Mods.txt line 537 cross-references UNIMOD:914 (methylmalonylation on serine) and the loader gives 1915. The table marks both AMBIGUOUS rather than picking. NEITHER HAS FIRED: of the 100 distinct modification names that have actually reached ptm_sites across the three datasets we agree with the loader on all 100, so nothing shipped is wrong. The registry is right by luck on a narrow corpus and blind on a wide one. Default in U9: consume the pinned TSV, fall back to the resource parse only where the mzLib version has no table, and say in the reader log which was used. Deliberately NOT done in the same change as G25 - it would wire a third repository's file into the bundle content hash on our own authority and confound two large movements in one bundle id. The open part is distribution, not correctness."
  - "G27 Bundle id identity. CLOSED 2026-09-20 in datarepo 0.5.0, answering aging 019 section 1. Their hypothesis was right: add_declaration hashed entry.raw, so reason, notes and flags were in the bundle id, and rewording a reason moved the id while every row stayed identical - which is why their PXD027318 ingest produced d77407d41e82858b and ours 809772ab5cdbd2e0 from the same search output. The id now covers manifest.CONTENT_FIELDS only (accession, run, stages, search_results, title, files, organism, acquisition, quant_method, labelling, labelling_plex, enrichment, metamorpheus); NON_CONTENT_FIELDS names the rest with a reason each, and a test fails on any DatasetEntry field in neither list. The answer for operators: a bundle id is an identity for the measurements plus the ingest configuration, and nothing editorial. TWO SMALL THINGS FOUND WHILE CLASSIFYING, both told to aging: the manifest's provenance_schema is a declared expectation nothing checks (we read the schema from provenance.json itself), and sdrf is declared but never read (we glob the run folder). The manifest promises two things it does not deliver."
  - "G28 search_modifications does not mean what its description claims. OPEN, asked as thread 021 section 6. The description says 'Every modification the search considered for a dataset (P1; J8 mass-silent checks)', but the table is built from the search task's parameters, so it holds what was DECLARED, not what was PLACED. All three datasets declare 33 UNIMOD accessions; their peptidoforms carry 16, 46 and 57, of which 4, 17 and 29 are absent from the table. A GPTMD run draws modifications from UniProt annotations on the database entries and those are not in the task's mod list - S-(2,3-dicarboxypropyl)cysteine on C is in PXD032202's peptidoforms and is not a row in its search_modifications at all. Nothing is lost (the evidence is in the peptidoforms) but a J8 mass-silent check reading this table to ask what the search COULD have found gets a wrong answer on the two GPTMD-heavy datasets. Default: fix the description rather than the table, and add a derived view for what was actually placed. 0 rows of consequence today."
  - "G29 One version was doing two jobs. CLOSED 2026-09-20 in datarepo 0.6.0, and it was forced rather than chosen: 0.6.0 is entirely a `build` change, but __version__ was in the BUNDLE hash, so releasing it would have re-identified every bundle in every store for rows that are byte-identical - the same over-hashing failure G27 had just fixed one level down, one release later. bundle.INGESTER_VERSION is now the only version in a bundle's content hash and is bumped in the same commit as any change to what an ingest reads, parses, derives or writes; it sits at 0.5.0 and lags __version__ on purpose. catalog_id keeps __version__, gains every study layer's version, and CATALOG_VERSION went 1 -> 2, so adding the whole study layer moved every catalog id and not one bundle id - verified on the three real datasets, which re-ingest to 0c11db8240f2634f / 9b73a64dc7d790f5 / 0bae469980d59d24 unchanged. Two tests pin both directions. bundle.json records both versions because they answer different questions: what an operator installed, and what the id was computed from. THE PATTERN WORTH KEEPING: three times in two days the same boundary failed - under-hashed manifest entry, over-hashed manifest prose, over-hashed package version - and each time the test is the same one sentence, does this change what the rows say."
  - >-
    G30 The study delivery path is built on an UNANSWERED question and is reversible on purpose
    (DATAREPO-20(a), thread 022 section 2a, re-stated in 023). datarepo 0.7.0's `datarepo study`
    writes a study bundle and `build --study` loads it, both opt-in, and no search bundle id moved.
    What is NOT settled: the file-level contract (a table per .tsv/.csv/.parquet with schema column
    names) is ours, not aging's. If they hand over a different shape, `study.read_table_file`
    changes and the bundle and catalog contracts do not. Two joins are deliberately unenforced until
    they answer - `feature_id` against anything (DATAREPO-20(c)) and `definition_id` against
    `definitions` - because a foreign key written now would freeze a guess with the authority of a
    constraint.
  - "G4 .gitignore template ignores bin/ (same as aging G21); add !/<dir>/bin/ exceptions if code lands in a bin/ folder."
  - "G9 Does NCEMS host public web services (not just compute)? Ask an NCEMS contact; if not, D1's production target needs revisiting."

