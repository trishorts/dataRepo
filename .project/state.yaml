    carried by any member, always, with `n_members` / `n_with` / `on_leading` to reconstruct any
    rule at query time; their new **D22** names the members carrying each term, so our expansion is
    an exact join rather than a broadcast. **NEW and unaddressed:** `organelle_category` is
    SET-VALUED, which is a grain problem in a `string` column, and there is a subcategory column
    (their D14/D20) we have never seen. **WE WERE BUILDING AGAINST A SUPERSEDED SPEC** -- aging
    wrote REQ-GO-2..10 on our behalf, we cited it in our own schema description, and three threads
    of go rulings moved out from under it. Their instruction: *trust D1-D22, not REQ-GO-2..10*, and
    they offered a flat current column contract as their 004. ACCEPT THAT OFFER before building.
    Also: go v1 ships in three layers and the third is one column in OUR schema -- we are a design
    stakeholder, not only a consumer.
  - >-
    G40 NOTHING STOPS A HUMAN AND A MOUSE AGE EFFECT BEING POOLED. `AgeEffect` has 29 columns and
    `AgeEffectMeta` 22, and **organism is in neither** -- while `age_effect_meta` exists precisely
    to pool across datasets, stratified on `tissue`, `acquisition` and `quant_method`. Two effects
    for one feature from different animals would pool into a meta-estimate with `n_datasets = 2`
    and nothing recording the difference. Same shape as the contaminant-organism defect of
    2026-09-22: a column that permits something wrong with nothing saying so -- except this one
    reaches a meta-analysis rather than a query. Raised 2026-09-22 by the user asking whether ages
    in years suit mouse and rat; the storage unit turned out fine (`age_raw` is verbatim and
    required, and sdrf's SdrfAge now carries `Cell`), and the defect was one layer down.
    TWO HALVES. **Ours:** add organism to both tables, or state and enforce that a meta row is
    single-organism by construction. We prefer the column -- `tissue` is already there for the same
    reason and organism is coarser and more consequential. Fix regardless of aging's answer.
    **Theirs (asked as thread 038):** `aging:DEF-AGE-EFFECT v1` defines `beta` on
    `age_decades = (age_years - 50) / 10`, and **50 is a human lifespan constant** -- a 24-month
    mouse gives `age_decades = -4.8` and a 'change per decade' for an animal that lives two years.
    Either the definition is declared human-only or the centring becomes per-organism. Our default
    if unanswered when rodents arrive: **refuse the row** (`age_effect_refusals` exists) rather
    than write a beta we cannot explain. NOT URGENT -- the corpus is human and aging are 2 of 160
    qualifying human datasets in -- but the cheapest moment to decide what beta means for a mouse
    is before a mouse beta exists, which is the `ptm_stoichiometry`-corrected-at-0-rows argument.
  - >-
    G41 `age_mappings` was designed for the cross-species problem and is wired to nothing. The
    table carries `organism`, `age_from`, `age_to`, `age_unit`, `life_stage`,
    `human_equivalent_years` -- exactly what G40 needs -- and holds 0 rows, is referenced by no
    view, and is mentioned in no thread before 038. Meanwhile aging's benchmark B6 ('for mouse
    datasets, which ages in months correspond to which human life stage?') is one of only two
    questions `SCHEMA_COVERAGE.md` maps to NO HOME. It has a home; the wire was never connected.
    Asked in 038 §3 whether this table is meant to be the bridge and whose it is to fill -- it is a
    reference resource rather than a measurement, so by D1 it is probably neither aging's nor ours.
    Re-map B6 in SCHEMA_COVERAGE.md once an owner exists.
  - >-
    G42 `samples` cannot distinguish 'the deposit was asked and answered `not available`' from
    'the deposit was never asked'. Found answering sdrf SDRF-DR1 on 2026-09-22. PXD036557's SDRF
    carries `characteristics[organism part]` and `characteristics[disease]`, both `not available`
    in all 18 rows -- and `samples.organism_part` is NULL for those 18 exactly as it is for the
    144 samples in the eight datasets with no SDRF at all. This is the `empty` vs `unknown` rule
    this project has already written down twice (`referenced_tables` returning `[]` for both
    'reads no tables' and 'cannot tell'; `describe` reporting a 100%-NULL column separately from
    an absent one), shipped a third time. sdrf's own §2 makes the same argument upstream: a column
    that is missing has no fill rate, so it is invisible to every quality instrument. Fix is ours.
    Default: carry the deposit's verbatim cell into `sample_characteristics` (which already has
    the `(sample_id, name, value)` grain) and let `samples` stay the typed projection, so absence
    and a reserved word stop sharing NULL. Answered to sdrf in 004 §3 as owed.
  - >-
    G43 Leading-protein identity is not recoverable from this pipeline's output, and we nearly
    stored a false column claiming it. go 002 §2.5 asked us to commit to `accession_is_leading`
    as load-bearing. MetaMorpheus's `AllQuantifiedProteinGroups.tsv` has 26 columns and none names
    a razor, leading, representative or principal protein, and its `|`-joined `Protein Accession`
    list is alphabetically sorted (159 of 159 multi-accession rows across PXD036557 and PXD024803,
    zero deviations). So position 1 is alphabetical rank, and aging's 013 measurement
    (2,608/2,427/131/50) that go quotes is measuring `min(group)` by string comparison -- as is
    our own 9-dataset reproduction of it (4,354/4,123/171/60). Refused in go 003 §1 with the
    replacement measurement (354 of 4,354 accessions change group COMPOSITION across datasets,
    316 alone in one dataset and grouped in another). Open as DATAREPO-28 to go and to pyMzLib:
    does any MetaMorpheus output expose a razor assignment we are not reading? Default if both
    say no: record jointly that it is unrecoverable, so neither project reconstructs it from a
    sort again. Do NOT add the column meanwhile -- it is `Protein.organism` with a better motive
    and, unlike that one, undetectable by a reader.
  - >-
    G44 `Protein.organism_name` is populated for decoy entries, inconsistently, while
    `Protein.organism` is correctly NULL for them. Measured on catalog `f8fc910cce116fbe`
    (9 datasets, 2026-09-22): decoys missing `organism_name` run 149 of 7,157 in PXD023381 and
    899 of 14,886 in PXD027318 but 11,804 of 11,804 in PXD024803 and 17,030 of 17,030 in
    PXD049018 -- so in some datasets a reversed sequence carries a species name and in others it
    does not. Schema 0.0.7's own description says why that is wrong: a reversed decoy sequence is
    no organism's protein at all, which is exactly the reasoning that made `organism` nullable.
    Same defect class as the contaminant-organism falsehood, one column over and caught before it
    reached an answer. Default: NULL `organism_name` for decoys at ingest, which is an
    `INGESTER_VERSION` bump. NOT urgent -- no view or benchmark question reads decoy rows -- but
    it is a lie sitting in a column whose whole job is to be the verbatim species evidence.
  - >-
    G45 aging's serving catalog is stale and they have not been told. Measured 2026-09-22:
    `F:/aging_data/repo/catalog.duckdb` holds 4 datasets on builder 0.11.0, built 07:20, while the
    store holds 9 bundles ingested 09:12-09:21 on 0.13.0 with entirely different ids
    (PXD023381 is `64ea541b11d57f4d` in the catalog and `1600ae76b313a561` in the store). So
    everything they currently serve, benchmark or cite is pre-collapsed-column-fix data. We built
    to a scratch path rather than overwrite a serving file mid-batch (the thread-033 rule: an hour
    of our tidiness can cost them an hour of compute), which means the telling is still owed.
    Send as thread 039, and fold in G44 since it is also an ingest-side fix they would want before
    re-ingesting again. NOT urgent for us -- our measurements used the fresh scratch catalog
    `f8fc910cce116fbe` -- but every number they quote until then is from the old data.
  - "G4 .gitignore template ignores bin/ (same as aging G21); add !/<dir>/bin/ exceptions if code lands in a bin/ folder."
  - "G9 Does NCEMS host public web services (not just compute)? Ask an NCEMS contact; if not, D1's production target needs revisiting."

skip_log:
  - date: 2026-09-22
    item: "threads.py QID regex cannot represent sdrf's SDRF-DR1..DR5 question IDs"
    reason: >-
      The checker validates question IDs against `^(?:REQ-)?[A-Z][A-Z0-9]{1,15}-[A-Z]?\d+$` -- ONE
      optional letter before the digits. `DATAREPO-28`, `LOGS-Q1` and `REQ-LOGS-5` all pass;
      `SDRF-DR1` fails, so sdrf's own question IDs cannot go in message front matter and `ledger`
      cannot track them. Worked around in our 004 by carrying them in the prose ledger and leaving
      `answers: []`, because renaming a peer's IDs is worse than not tracking them. NOT FIXED here
      deliberately: `threads.py` is a shared asset under `~/.claude/skills/project/assets/` used by
      all ten /project folders, so widening the regex is a change to every project's tooling and
      belongs in its own pass with the other nine in mind -- not at the end of a session, on our
      own authority, to suit one peer's naming.
  - date: 2026-09-20
    item: "G26 - replace the in-house modification registry with QuantProject's loader-generated IdWithMotif-to-Unimod.1.0.591.tsv"
    reason: >-
      Correctness is not in doubt (the loader is authoritative and we differ from it on two names,
      neither of which has fired), but consuming it would wire a third repository's file into the
      bundle content hash on our own authority, in the same release as the ptm_site_id rekey - two
      large movements confounded in one bundle id. The open part is distribution, not correctness,
      and it is asked in thread 021 section 5 with a default recorded as U9.
  - date: 2026-09-20
    item: "DATAREPO-20(a) - build the delivery path that lets aging hand over stage 7's age_effect rows"
    reason: >-
      The study layer's SHAPE is what aging asked for and what shipped. Building the command that
      carries rows into the repository would have fixed a hand-off contract before asking them how
      they want to hand rows over, on an object that does not exist yet. The default (a separate
      study bundle loaded by `build`) is recorded and is buildable under D7 if they go quiet.
    resolved: 2026-09-21
    resolution: >-
      Taken off the skip list and BUILT on the recorded default, after a day with no reply (D7).
      datarepo 0.7.0 ships `datarepo study` and `build --study`. The reversibility argument that
      made it a skip is what made it safe to build: a study bundle is a separate object, so if aging
      wants another hand-over only the reader changes, and no search bundle id moved. What is still
      unsettled is tracked as G30, and the build is re-stated to aging in thread 023.

