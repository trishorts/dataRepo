name: dataRepo
created: 2026-09-19
phase: INCEPTION

goal: >
  Design and build an AI-ready, API-accessible data repository that organizes the search + quant
  results (PSMs, peptides, proteoforms/PTMs, protein groups, FlashLFQ quant, provenance, SDRF design,
  GO/organelle annotation) from dozens-to-hundreds of PRIDE datasets reanalyzed by the aging pipeline,
  so humans and especially AI agents can query aging-related proteomic changes across organelles.

# SIBLING of aging: aging PRODUCES results (pipeline); dataRepo STORES + SERVES them.
#   aging -> run outputs on F:\aging_data\<run>\<PXD>\ with provenance.json (aging-provenance/2)
#   dataRepo ingests those; it never re-runs searches.
depends_on: [aging]

decisions:
  - id: D1
    date: 2026-09-19
    text: "Hosting: aging D5 applies. Prototype locally (data on F:, API on localhost); NCEMS operators run production from a portable Docker Compose package + handover doc. No Windows-only paths. (Closes G2; whether NCEMS hosts web services is G9.)"
  - id: D2
    date: 2026-09-19
    text: "Access: public from day one, no login anywhere (user: 'all open all the time'). Rate limiting lives in the operators' proxy, not our code. Versioned releases with a DOI from the start. (Closes G3.)"
  - id: D3
    date: 2026-09-19
    text: "Licences: data CC BY 4.0; code MIT."
  - id: D4
    date: 2026-09-19
    text: "Format: QPX-compatible superset. Use QPX column names/types where it has a matching view; extend for proteoforms, USI per PSM, organelle, age. Every file records the QPX version it matches. (Closes G6 part a.)"
  - id: D5
    date: 2026-09-19
    text: "Scope: human + rodent, DDA + DIA, label-free + TMT from v0 (user: 'definitely DIA and TMT and rodent'; aging's 'DIA is out' is wrong). organism, acquisition, quant_method, instrument_vendor are real columns. Quant table is long: (run, channel, feature, value). Only the aging-DDA-LFQ ingester is written now; DIA/TMT ingesters when aging produces that data (Q6 option A, taken by default; user may revisit). Relayed to aging as thread dataRepo/001 DATAREPO-1. (Closes G6 part b.)"
  - id: D6
    date: 2026-09-19
    text: "The benchmark questions come from aging, not dataRepo (user: 'have the aging project generate all the questions. let's keep this project just a bit more generic'). dataRepo stays generic: it stores, serves and is scored against a question set; it doesn't set the science agenda. How generic the schema gets is G10."
  - id: D7
    date: 2026-09-19
    text: "Every question that needs a human answer goes into design/OPEN_QUESTIONS.md with a default, grouped by who answers (NCEMS / user + working group / aging). The user takes it to meetings. Work proceeds on the defaults."

  - id: D8
    date: 2026-09-19
    text: "dataRepo is code, not data (user: 'this should just be code. I think aging should host the data'). This repo holds the schema, ingester, API/MCP server and deploy package, and never data. aging owns the data instance: the Parquet bundles, the release/changelog entries and DOIs (R2 is now an aging-instance table; dataRepo only defines it), and deploying the service over its results. Refines D1 (NCEMS still runs production, as aging's deployment) and D2 (aging's releases carry the DOIs). How much of running the service aging takes on is U6."

  - id: D9
    date: 2026-09-19
    text: >-
      Ingest contract (implemented, FRAMEWORK step 1). `datarepo ingest` reads the producing
      instance's manifest.yaml and never scans the work root: status include/hold/exclude is the
      producer's call and a non-include dataset is refused with their reason. Bundles are
      content-addressed on (inputs, schema version, ingester version), so re-ingest is a no-op and a
      changed input cannot overwrite a cited bundle. Parquet columns are generated from the LinkML
      schema (tools/build_tables.py, CI drift check), never hand-listed. pyMzLib parses producer
      formats; where dataRepo reads one itself the reason is recorded in the bundle's reader log and
      raised as a request. Every bundle reconciles its own counts against the producer's totals using
      the producer's acceptance rule, and a disagreement becomes a Finding, never a silent
      difference. Referential integrity is checked before any write. Definition IDs are namespaced
      `<owner>:<ID>` (U7) and numbers with no published definition use `PROVISIONAL:<NAME>`.

  - id: D10
    date: 2026-09-19
    text: >-
      Catalog contract (implemented, FRAMEWORK step 2). `datarepo build` loads an instance's bundles
      into one DuckDB file and never walks the store: the manifest is the contract here as it is for
      ingest, so a withdrawn dataset is refused with the producer's reason even though its bundle is
      on disk, and a dataset with several bundles is pinned (--bundle) or taken newest (--latest),
      never guessed. The catalog is derived and disposable - layer 1 stays the product - and is
      content-addressed on (bundle ids, schema version, builder version), so rebuilding is a no-op.
      Tables are materialised so the catalog is one movable file; every schema table exists even
      when empty; every row carries dataset_id and bundle_id, which is what gives `proteins` and
      `definitions` a dataset. The producing search engine's acceptance rule is applied once, in the
      views psms_1pct / peptidoforms_1pct / protein_groups_1pct, so the catalog's headline numbers
      are the numbers the bundle reconciled; a test asserts the SQL and the ingester's Python agree.
      Row counts, uniqueness and references are re-checked against the bundle manifests using
      integrity.py's own lists, a failure stops the build rather than becoming a Finding, and the
      build stages to a temporary file so a failure leaves the previous catalog serving.

  - id: D11
    date: 2026-09-19
    text: >-
      A release pins its bundles, and the tool enforces it. `datarepo build --release <version>`
      requires a --bundle pin for every dataset and refuses --latest outright (aging 011 asked for
      enforcement rather than a default). A release that can silently pick up a later re-ingest is
      not a release, and the failure is invisible: the catalog builds cleanly and says something
      other than what was cited. aging v0.1 is pinned to PXD036557=84ca279df425c0a2 at
      F:/aging_data/repo/releases/v0.1/catalog.duckdb.

gaps:
  - "G1 Framework: PROPOSED 2026-09-19 in design/FRAMEWORK.md v0 (Parquet files, DuckDB catalog, FastAPI + MCP over one code path, LinkML schema, QPX superset, USI per PSM). Steps 1 (ingest) and 2 (build) are BUILT and their contracts locked as D9 and D10; the rest (client/MCP, REST, deploy) is still a proposal the user has not reviewed. Next: /grill-me on steps 3-6, then record the locked choices as decisions."
  - "G5 Step 0 question set: OWNED BY AGING (D6). READY 2026-09-19 (aging 003): aging/design/QUESTIONS.md v0.3, 168 questions, top 10 = K1 D2 O1 D1 T2 N1 M1 C1 G1 J16. Read it from trishorts/aging master; never copy it. MAPPED 2026-09-19 in design/SCHEMA_COVERAGE.md: 70 answerable at ingest, 94 waiting on a producer, 2 no home (J12, P2), 2 out of v1. Re-map when QUESTIONS.md or the schema changes."
  - "G11 Tables aging 003 routed to dataRepo. OWN: R2 release/changelog. STORE (aging-produced): R1 census, R3 dataset axes (+ enrichment, labelling), R8 reference panels, R9 clock model. STORE (MetaMorpheus-produced): R7 PTM stoichiometry, R16 glycopeptides (compositions, not structures, J9), R7b proteoform inference with confidence (no top-down, J16). All drafted in schema v0; producers' column names still to confirm."
  - "G10 Genericity (U5 in design/OPEN_QUESTIONS.md): proposal = generic core schema + a pluggable study layer (aging supplies age_effect, organelle_age_summary, sample age columns). Not yet confirmed."
  - "G7 Count mismatches: S21 CLOSED by aging 006. DATAREPO-14 CLOSED 2026-09-19: aging 008 gave the missing clause (a PSM whose `Notch` cell contains `|` never resolved and is not counted), and it is now implemented. Psm.notch stores the cell verbatim and Psm.notch_ambiguous the conclusion; producer_counts and the catalog's psms_1pct view both apply it. PXD036557 reconciles on all five checks - 26,582 PSMs, 5,541 peptidoforms, 1,652 protein groups, 18 runs, 266,402 MS2 - and the count_mismatch Finding is gone. Peptidoforms are unaffected: no accepted peptide row is ambiguous. Schema 0.0.1 -> 0.0.2 and datarepo 0.1.0 -> 0.2.0, so PXD036557 is a new bundle (84ca279df425c0a2); the old 6fea2187b2d9f737 stays on disk and citable. S20 (dataset counts) still open on aging's side."
  - "G12 D8 instance role: CLOSED 2026-09-19 by aging 006. aging accepted populating and hosting the instance including the running service (their D18). Data at F:\\aging_data\\repo\\ (store/<PXD>/<bundle-hash>/, releases/<version>/), CC BY 4.0, credit 'NCEMS Aging Proteome Working Group', releases and DOIs in aging/instance/RELEASES.md. U6 answered yes. First release target: v0.1, PXD036557 alone, private to the working group."
  - "G13 QPX version is unpinned. Bundles record qpx_version: 'unpinned' (src/datarepo/bundle.py) because the column mapping has never been checked against a QPX release. D4 requires every file to record the QPX version it matches. Next: pin a release of github.com/bigbio/qpx, map our column names onto its views, and set QPX_VERSION."
  - "G14 pyMzLib reader gaps. SDRF CLOSED 2026-09-19: src/datarepo/readers.py now calls pymzlib.sdrf.read, the in-house SDRF read is deleted, and the four SDRF-derived tables are byte-identical to what it produced on real PXD036557 data. Characteristics are copied by position, so a repeated column name is kept (pyMzLib's own caveat; comment[modification parameters] repeats in that file). STILL OPEN at 0.1.1, re-tested on real data: pro_forma is present but 0 of 42,958 and 0 of 12,653 records populated, so src/datarepo/proforma.py stays (DATAREPO-12); AllQuantifiedPeaks.tsv fails with \"Header with name 'MBR Score'[0] was not found\" and AllQuantifiedPeptides/ProteinGroups.tsv with 'Tsv file type not supported' (DATAREPO-13b, pyMzLib 005). WITHDRAWN: matched-ion columns are deliberately excluded, listed in NativeRecords.excluded_fields with reasons. Residual to relay: the generic read_records() path on a .sdrf.tsv is unchanged and still joins header and cells with ';', so only pymzlib.sdrf.read is safe for an SDRF. All of this is in thread 010."
  - "G15 Provisional definitions (DATAREPO-11, thread 007). Eight numbers the ingester stores have no published definition and carry PROVISIONAL:<NAME> IDs whose own text says so: FlashLFQ peptide and protein intensity and protein spectral count (QuantProject's), and peptide/protein-group counts at 1% FDR, MS2 count, run minutes, precursor count (aging's). Swap them for the owners' IDs when published. Namespacing of definition IDs as <owner>:<ID> is U7."
  - "G16 ptm_sites coverage of the occupancy sites. LARGELY CLOSED 2026-09-19. DATAREPO-17 answered by aging 013 with QuantProject's DEF-OCC-PSMS text: the occupancy population is every PSM passing the q-value threshold AT PSM LEVEL, with no ambiguity-level filter, on a protein group whose definition includes contaminants. Both of our filters were wrong. Dropping the level-1 requirement and keeping non-decoy instead of target-only took ptm_sites 1,370 -> 1,997 and the uncovered occupancy sites 217 -> 29 (93%). PtmSite.best_ambiguity_level and PtmSite.target_decoy keep the old derivation available as a WHERE clause: level '1' + target reproduces the old 1,370 ids exactly, though 25 of them now carry a higher n_psms because n_psms counts every accepted PSM that placed the site (which is what the occupancy denominator is built from). RESIDUAL 29: 13 are at position 0, i.e. protein N-terminal, which ptm_site_rows skips by construction while DEF-OCC-CELL encodes the N-terminus as 0 - representing them means deciding how a terminal modification is keyed. All 13 position-0 sites are N-acetylmethionine on M, and there are no N-acetylmethionine sites anywhere else, so the cause is exact. Asked as DATAREPO-18 (thread 014): how should a protein-terminal modification be keyed? Default: position 0, residue 'N-term', giving <acc>:N-term0:<UNIMOD>, matching DEF-OCC-CELL so the tables join. It is a join key, so changing it later is expensive. The other 16 are scattered internal positions with no explanation yet. CAVEAT from aging: the no-level-filter reading is their interpretation of QuantProject's text, not QuantProject's ruling; they are confirming it. The relaxation is additive and cheap to reverse."
  - "G17 aging 011 schema corrections, accepted and not yet implemented. ptm_stoichiometry: n_modified_psms / n_covering_psms (DEF-OCC-COUNT counts spectra, and the denominator includes PSMs carrying a different modification); modified_fraction splits into modified_fraction_count (QuantProject:DEF-OCC-COUNT v3) and modified_fraction_intensity (QuantProject:DEF-OCC-INT v3.1), which must never be averaged - they differ 3x overall and 7x at 21-50 PSM sites; add intensity_is_floor (DEF-OCC-INT-ZERO: 0.0000(0/X) is a floor, not a zero); drop uncertainty; assay_id is the sample group, not the run; ptm_site_id carries the accession. Counts come from CountOccupancy_ ONLY - IntensityOccupancy_'s parenthesised pair is scientific-notation intensity, and a [0-9.]+ pattern silently matches none of it. Model the third state: 1,654 count-quantified vs 1,597 intensity-quantified observations, and the 57 difference is neither DEF-OCC-ABSENT nor DEF-OCC-INT-ZERO. proteoform_inferences.inference_confidence becomes an enum of evidence classes or is dropped. Both tables are 0 rows, so all of this is still free."
  - "G18 ptm_sites hygiene from aging 011 section 4. 4.1: 81% of ptm_sites is carbamidomethyl, which DEF-OCC-PSMS excludes from occupancy by construction, so a null stoichiometry must be explained rather than read as a pipeline failure - default is a reason column on PtmSite (excluded_fixed / excluded_common_variable / not_computed), not a restricted table. 4.3: Hydroxybutyrylation on K has no UNIMOD accession and would write a null into ptm_site_id; make an unresolvable modification fail at ingest instead. 4.4: the residue stays in ptm_site_id - UNIMOD:7 is deamidation on N and Q and citrullination on R - and the reason belongs in the schema description so it survives the person."
  - "G19 The study layer is the largest lever and it is half ours. aging's benchmark pass (their 013, results/BENCHMARK_v0.1.md) scored all 168 questions against the built catalog with 18 executed as SQL: 63 ANSWERABLE, 65 NO_TABLE, 25 EMPTY_TABLE, 10 NO_METADATA, 5 ONE_DATASET. `age_effect` alone is required by 46 questions and 42 are blocked by nothing else; it is the only missing object four of the ten starred questions (D1, K1, N1, T2) depend on. Section D - whether organelles age at different rates, the proposal's own question - scores 1 of 19. Section B scores 0 of 11 because no table anywhere has an age column. OURS: instantiate SampleAge, ClockModel, ClockFeature and AgeMapping from schema/study/aging.yaml, plus the age_effect table SHAPE. THEIRS: the definition of an age effect - model, covariates, normalization - which is benchmark G6, and a shape built around a guess at it would be worse than no table. Honest qualifier from aging: for PXD036557 every biological sample field is null, so section B stays 0 here even with the column. The schema gap and the data gap are separate and both real. Told them in thread 014 that we treat section B and the 46 as one piece of work."
  - "G20 Owed to aging from their 013 section 4.2, not yet done: swap five PROVISIONAL: definition IDs for the aging:DEF-* IDs their D20 published (MS2-COUNT, PEPTIDE-COUNT-1PCT, PRECURSOR-COUNT, PROTEIN-GROUP-COUNT-1PCT, RUN-MINUTES). The bundle was written nine minutes before their 008 issued the real ones, so this is timing rather than disagreement. PROTEIN-INTENSITY and PROTEIN-SPECTRAL-COUNT stay PROVISIONAL and should - QuantProject has not ruled, and an ID implying they had would be worse than the placeholder. Mechanical; needs no reply."
  - "G21 WAITING on aging, nothing blocked: DATAREPO-19 (thread 014) - which ingester re-cuts v0.1. They HELD v0.1 from citation because the bundle's id_rate metric and low_id_rate finding report 27958/266402 = 10.5% using DEF-PSM-FDRENGINE instead of the canonical DEF-PSM-1PCT (9.98%); it is their number from their provenance.json and their fix (their S28/G34), and the contamination metric they defined was never emitted (S30). Their corrected provenance moves the bundle hash anyway, so the fork is: pin ingester 0.2.0 / schema 0.0.2 and keep v0.1 exactly as scoped, or take 0.3.1 / 0.0.3 with the 1,997-row ptm_sites. We recommended 0.3.1 CONDITIONAL on QuantProject confirming the no-ambiguity-filter reading, 0.2.0 if that is slow. Do not re-ingest their store until they choose: F:/aging_data/repo/store/PXD036557/84ca279df425c0a2 is what v0.1 is pinned to and what they verified."
