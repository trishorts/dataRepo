  - "G16 ptm_sites coverage of the occupancy sites. LARGELY CLOSED 2026-09-19. DATAREPO-17 answered by aging 013 with QuantProject's DEF-OCC-PSMS text: the occupancy population is every PSM passing the q-value threshold AT PSM LEVEL, with no ambiguity-level filter, on a protein group whose definition includes contaminants. Both of our filters were wrong. Dropping the level-1 requirement and keeping non-decoy instead of target-only took ptm_sites 1,370 -> 1,997 and the uncovered occupancy sites 217 -> 29 (93%). PtmSite.best_ambiguity_level and PtmSite.target_decoy keep the old derivation available as a WHERE clause: level '1' + target reproduces the old 1,370 ids exactly, though 25 of them now carry a higher n_psms because n_psms counts every accepted PSM that placed the site (which is what the occupancy denominator is built from). RESIDUAL 29: 13 are at position 0, i.e. protein N-terminal, which ptm_site_rows skips by construction while DEF-OCC-CELL encodes the N-terminus as 0 - representing them means deciding how a terminal modification is keyed. All 13 position-0 sites are N-acetylmethionine on M, and there are no N-acetylmethionine sites anywhere else, so the cause is exact. Asked as DATAREPO-18 (thread 014): how should a protein-terminal modification be keyed? Default: position 0, residue 'N-term', giving <acc>:N-term0:<UNIMOD>, matching DEF-OCC-CELL so the tables join. It is a join key, so changing it later is expensive. The other 16 are scattered internal positions with no explanation yet. CAVEAT from aging: the no-level-filter reading is their interpretation of QuantProject's text, not QuantProject's ruling; they are confirming it. The relaxation is additive and cheap to reverse."
  - "G17 aging 011 schema corrections, accepted and not yet implemented. ptm_stoichiometry: n_modified_psms / n_covering_psms (DEF-OCC-COUNT counts spectra, and the denominator includes PSMs carrying a different modification); modified_fraction splits into modified_fraction_count (QuantProject:DEF-OCC-COUNT v3) and modified_fraction_intensity (QuantProject:DEF-OCC-INT v3.1), which must never be averaged - they differ 3x overall and 7x at 21-50 PSM sites; add intensity_is_floor (DEF-OCC-INT-ZERO: 0.0000(0/X) is a floor, not a zero); drop uncertainty; assay_id is the sample group, not the run; ptm_site_id carries the accession. Counts come from CountOccupancy_ ONLY - IntensityOccupancy_'s parenthesised pair is scientific-notation intensity, and a [0-9.]+ pattern silently matches none of it. Model the third state: 1,654 count-quantified vs 1,597 intensity-quantified observations, and the 57 difference is neither DEF-OCC-ABSENT nor DEF-OCC-INT-ZERO. proteoform_inferences.inference_confidence becomes an enum of evidence classes or is dropped. Both tables are 0 rows, so all of this is still free."
  - "G18 ptm_sites hygiene from aging 011 section 4. 4.1: 81% of ptm_sites is carbamidomethyl, which DEF-OCC-PSMS excludes from occupancy by construction, so a null stoichiometry must be explained rather than read as a pipeline failure - default is a reason column on PtmSite (excluded_fixed / excluded_common_variable / not_computed), not a restricted table. 4.3: SUPERSEDED 2026-09-20 by G25. The prediction was wrong twice over: an unmapped modification wrote no null, it wrote no row, and failing the ingest would have been the wrong remedy -- 42 real sites over 10 chemistries would have taken three datasets down instead. The key no longer depends on an accession, so an unmapped modification is an ordinary row with a null `modification`. What DOES fail at ingest now is a modification name containing ':', the ptm_site_id separator, which means the mod token did not parse and we cannot say what the modification is. 4.4: the residue stays in ptm_site_id - UNIMOD:7 is deamidation on N and Q and citrullination on R - and the reason belongs in the schema description so it survives the person."
  - "G19 The study layer is the largest lever and it is half ours. aging's benchmark pass (their 013, results/BENCHMARK_v0.1.md) scored all 168 questions against the built catalog with 18 executed as SQL: 63 ANSWERABLE, 65 NO_TABLE, 25 EMPTY_TABLE, 10 NO_METADATA, 5 ONE_DATASET. `age_effect` alone is required by 46 questions and 42 are blocked by nothing else; it is the only missing object four of the ten starred questions (D1, K1, N1, T2) depend on. Section D - whether organelles age at different rates, the proposal's own question - scores 1 of 19. Section B scores 0 of 11 because no table anywhere has an age column. OURS: instantiate SampleAge, ClockModel, ClockFeature and AgeMapping from schema/study/aging.yaml, plus the age_effect table SHAPE. THEIRS: the definition of an age effect - model, covariates, normalization - which is benchmark G6, and a shape built around a guess at it would be worse than no table. Honest qualifier from aging: for PXD036557 every biological sample field is null, so section B stays 0 here even with the column. The schema gap and the data gap are separate and both real. Told them in thread 014 that we treat section B and the 46 as one piece of work. UNBLOCKED 2026-09-20 by aging 017: aging:DEF-AGE-EFFECT v1 is published in aging/design/DEF_AGE_EFFECT.md. THREE tables, not one - age_effect keyed on (dataset_id, feature_id, response, estimator, quant_basis, model_form, stratum), age_effect_meta for the random-effects pooled estimate, and age_effect_refusals holding one row per fit NOT performed with the reason, which is how trap J6 resolves to `no liver dataset carries donor ages` rather than to silence. se, age_span_years and covariates are NOT NULL; beta is per DECADE, not per year; a failed fit writes NO row rather than a null beta. aging is honest that no dataset in the instance can produce a single row yet - PXD060431 will be the first, n=10 per arm, one tissue. This is now the next piece of work and nothing blocks it. The SHAPE only: if a benchmark question needs a column aging's definition does not name, ask rather than add. BUILT 2026-09-20 in datarepo 0.6.0. schema/study/aging.yaml goes from a stub to eight real tables, generated into STUDY_TABLES by tools/build_tables.py exactly as the core's are and created by `datarepo build`. age_effects, age_effect_refusals and age_effect_meta are transcribed column-for-column from aging:DEF-AGE-EFFECT v1 and -META v1, with the definition's rules enforced by the shape rather than left as prose: beta, se, age_span_years, covariates, normalization, method and method_version are all NOT NULL, the seven-column key is NOT NULL throughout, and a failed fit has nowhere to write a null beta because it has its own table. Five enums carry the benchmark question that forces each to exist. Every table is EMPTY and will stay empty: nothing in the ingest path writes them, which is DATAREPO-20. Creating them anyway is the deliverable - aging's benchmark distinguishes NO_TABLE from EMPTY_TABLE, and the 46 questions scored the first. Section D's own query, do organelles age at different rates, now parses, joins protein_localizations and returns nothing. Four shape decisions are OURS and are asked as DATAREPO-20 in thread 022: how the rows arrive at all, glycosite vs glycopeptide, what a feature's cross-dataset identity is at meta grain, and whether stratum should be closed. Honest state unchanged: PXD060431 is admitted abundance-only, so these tables may stay empty for a while yet."
