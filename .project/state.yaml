    stdio against the live three-dataset catalog with the mcp 2.2.0 SDK. What step 3 has NOT had is
    aging's benchmark run against it (G35), so D15's bar is a design property rather than a
    measurement. Steps 4-6 were GRILLED 2026-09-21 and locked as D16-D18; the no-server half of 4-5
    (`datarepo site`) is next. Still open inside the framework: the REST API and the Docker Compose
    package are deferred pending N1/G9 and evidence of a human who wants REST (D16), and
