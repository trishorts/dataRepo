[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datarepo"
# Read from src/datarepo/__init__.py rather than restated here. It was restated, and it was wrong
# for four releases: pyproject said 0.3.1 while the package said 0.7.0, so `pip install datarepo`
# and `datarepo --version` disagreed -- and `__version__` is in every `catalog_id`, so an operator
# reconciling "what did I install" against a catalog got two different answers.
dynamic = ["version"]
description = "Ingest and serve the search + quant results of reanalyzed public proteomics datasets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=16",
    "PyYAML>=6",
]

[project.optional-dependencies]
# pyMzLib owns the parsing of producer file formats (FRAMEWORK section 3). The distribution is
# named `mzlib` on PyPI and imports as `pymzlib`; its wheels are per-platform and carry the mzLib
# bridge, so nothing has to be built and PYMZLIB_BRIDGE is not needed. It stays optional because
# the wheel is ~62 MB and `build`, `catalog` and `query` never read a producer file.
readers = ["mzlib>=0.1.1", "lxml>=5"]  # lxml: 3x faster protein-database parse; the stdlib fallback reads identically

# The MCP SDK, for `datarepo mcp` (D12). Optional for the same reason `readers` is: `ingest`,
# `build` and `query` never touch it, and the core stays at three dependencies. `serve()` accepts
# both the 1.x `FastMCP` and the 2.x `MCPServer` it was renamed to, so this is not pinned.
mcp = ["mcp>=1.2"]

[project.scripts]
datarepo = "datarepo.cli:main"

[tool.setuptools.dynamic]
version = {attr = "datarepo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `conftest.py` exports the fixture paths, so tests/ must be importable as a plain directory.
pythonpath = ["tests"]
