[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datarepo"
version = "0.1.0"
description = "Ingest and serve the search + quant results of reanalyzed public proteomics datasets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=16",
    "PyYAML>=6",
]

[project.optional-dependencies]
# pyMzLib owns the parsing of producer file formats (FRAMEWORK section 3). It is optional only
# so that `datarepo doctor` and the unit tests can run without a built mzLib bridge.
readers = ["pymzlib>=0.1.1"]

[project.scripts]
datarepo = "datarepo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `conftest.py` exports the fixture paths, so tests/ must be importable as a plain directory.
pythonpath = ["tests"]
